name: Wolf Audio Mischpult Pro – Projekt und APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-und-apk.yml'

permissions:
  contents: write

jobs:
  wolf-audio-apk:
    runs-on: ubuntu-latest
    steps:
      - name: GitHub-Projekt laden
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Android-Projekt aus ZIP entpacken
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import PurePosixPath
          filename = 'Wolf-Audio-Mischpult-Pro-1.4-Soundboard-GitHub.zip'
          with zipfile.ZipFile(filename) as archive:
              for item in archive.infolist():
                  path = PurePosixPath(item.filename)
                  if path.is_absolute() or '..' in path.parts:
                      raise ValueError(f'Ungueltiger ZIP-Pfad: {item.filename}')
              archive.extractall('.')
          PY
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

      - name: Projektdateien ins Repository uebernehmen
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Wolf Audio Mischpult Pro 1.4: Android-Projekt entpackt'
            git push origin HEAD:main || echo "Projektdateien konnten nicht auf GitHub gespeichert werden; APK-Bau wird trotzdem versucht."
          fi

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android-SDK vorbereiten
        uses: android-actions/setup-android@v3

      - name: Android API 35 installieren
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.9 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Debug-APK erstellen
        run: gradle --no-daemon :app:assembleDebug

      - name: APK zum Herunterladen bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Wolf-Audio-Mischpult-Pro-1.4-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
